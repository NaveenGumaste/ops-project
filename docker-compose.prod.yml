services:
  # Tier 1: Nginx Reverse Proxy (Front Desk - Port 80)
  nginx:
    image: nginx:alpine
    container_name: prod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - app-network

  # Tier 2: Next.js Standalone (Kitchen - connects to Amazon RDS)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prod-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      PGSSLMODE: "require"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
