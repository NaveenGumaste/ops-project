worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip Compression: Reduces network payload size for faster load times
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Define the Tier 2 Backend (Next.js Application Container)
    upstream nextjs_upstream {
        server web:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Diagnostic header proving Nginx is proxying the request
        add_header X-Served-By "Nginx-Tier1-FrontDesk" always;

        # Tier 1 Cache: Static Next.js assets with long-lived cache headers
        location /_next/static/ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Cache immutable assets for 1 year
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Served-By "Nginx-Tier1-FrontDesk-StaticCache" always;
        }

        # Static public files (favicons, SVG icons)
        location /public/ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Default Reverse Proxy: Forwards all pages & API route requests to Next.js
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;

            # Forward client connection headers & WebSockets support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            
            # Preserve original client headers for logging and security
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Proxy buffer settings
            proxy_buffers 8 16k;
            proxy_buffer_size 16k;
        }
    }
}